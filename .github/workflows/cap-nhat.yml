name: Cập nhật và đăng website

on:
  schedule:
    # Kiểm tra nhanh mỗi 5 phút: blog có bài mới hoặc bài sửa thì cập nhật ngay
    - cron: "*/5 * * * *"
    # Cập nhật đầy đủ mỗi ngày lúc 03:13 sáng giờ Việt Nam (20:13 giờ UTC hôm trước), kể cả tìm trên Zenodo
    - cron: "13 20 * * *"
  # nút "Run workflow" để chạy tay bất cứ lúc nào
  workflow_dispatch:
  # chạy lại khi sửa giao diện (index.html, muc-luc.html, assets/...)
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      co_moi: ${{ steps.xem.outputs.co_moi }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            /scripts/kiem_tra.py
            /data/muc-luc.json
            /tu-vung/data/tu-vung.json
          sparse-checkout-cone-mode: false

      - id: xem
        name: Xem hai blog có gì mới không
        env:
          LUON_CHAY: ${{ github.event_name != 'schedule' || github.event.schedule == '13 20 * * *' }}
        run: python3 scripts/kiem_tra.py

  cap-nhat:
    needs: kiem-tra
    if: needs.kiem-tra.outputs.co_moi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: cap-nhat
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.dang.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # luôn lấy bản mới nhất, kể cả khi lần chạy này phải xếp hàng chờ

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kéo bài từ blog và tra Zenodo
        run: python scripts/cap_nhat.py

      - name: Sao lưu blog Giải Nghĩa Từ Vựng
        run: python scripts/tu_vung.py

      - name: Lưu dữ liệu mới vào kho
        run: |
          git config user.name "cap-nhat-tu-dong"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có gì mới."
          else
            git commit -m "Cập nhật từ blog $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: dang
        uses: actions/deploy-pages@v4
